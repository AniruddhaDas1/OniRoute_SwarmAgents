name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: oniroute doctor
      - name: Validate YAML
        run: python -c "from pathlib import Path; import yaml; [yaml.safe_load(p.read_text()) for p in Path('.').rglob('*.yaml') if '.git' not in p.parts and '.venv' not in p.parts]"
      - name: Validate Markdown links and whitespace
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          missing=[]
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts or '.venv' in path.parts: continue
              for target in re.findall(r'\[[^]]+\]\(([^)]+)\)', path.read_text(errors='ignore')):
                  if '://' in target or target.startswith('#') or target.startswith('mailto:'): continue
                  clean=target.split('#',1)[0]
                  if clean and not (path.parent/clean).resolve().exists(): missing.append(f'{path}: {target}')
          if missing: raise SystemExit('\n'.join(missing))
          PY
          git diff --check
      - name: Build package
        run: python -m pip wheel . --no-deps -w dist
