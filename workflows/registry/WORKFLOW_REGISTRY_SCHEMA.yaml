schema_version: "0.1.0"
type: workflow_registry_record
required:
  - workflow_id
  - display_name
  - category
  - description
  - version
  - owner
  - maintainers
  - lifecycle
  - status
  - classification
  - validation_state
  - trust_level
  - quality_score
  - compatible_agents
  - compatible_skills
  - compatible_packages
  - compatible_platforms
  - required_artifacts
  - produced_artifacts
  - dependencies
  - security_classification
  - tags
  - source
  - license
  - provenance
  - created
  - updated
properties:
  workflow_id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]*$'}
  display_name: {type: string}
  category:
    type: string
    enum: [Architecture, Backend, Frontend, Database, Security, DevOps, AI, Testing, Documentation, Presentation, Analytics, Platform, Product, Operations, General Engineering, Custom]
  description: {type: string}
  version: {type: string, semantic_version: true}
  owner: {type: string}
  maintainers: {type: array, items: {type: string}}
  lifecycle: {type: string, enum: [Draft, Experimental, Reviewed, Verified, Official, Deprecated, Archived, Removed]}
  status: {type: string}
  classification:
    type: string
    enum: [Official, Community, Enterprise, Personal, Experimental, Imported, Generated]
  validation_state: {type: string, enum: [Unvalidated, In Review, Validated, Rejected, Waived]}
  trust_level: {type: string, enum: [Unknown, Limited, Reviewed, Verified, Trusted]}
  quality_score: {type: number, minimum: 0, maximum: 100}
  compatible_agents: {type: array, items: {type: string}}
  compatible_sub_agents: {type: array, items: {type: string}}
  compatible_skills: {type: array, items: {type: string}}
  compatible_packages: {type: array, items: {type: string}}
  compatible_platforms: {type: array, items: {type: string}}
  required_artifacts: {type: array, items: {type: object}}
  produced_artifacts: {type: array, items: {type: object}}
  dependencies: {type: array, items: {type: object}}
  approvals: {type: array, items: {type: object}}
  decision_gates: {type: array, items: {type: object}}
  capabilities: {type: array, items: {type: string}}
  security_classification: {type: string}
  tags: {type: array, items: {type: string}}
  source: {type: object}
  license: {type: string}
  provenance: {type: object}
  admission_evidence: {type: array, items: {type: object}}
  created: {type: string, format: date-time}
  updated: {type: string, format: date-time}
