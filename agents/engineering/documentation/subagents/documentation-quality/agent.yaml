does_not_own:
  - Documentation production or generation
  - Technical decisions owned by Engineering Agents
  - Provider-specific behavior
  - Skills, workflows, adapters, or runtime systems
inputs:
  - Review findings; standards; documentation inventory; quality goals
outputs:
  - Quality measures, consistency findings, governance recommendations, and trend reports
permissions:
  - Review relevant approved information and documentation evidence.
  - Recommend decisions within the bounded responsibility.
dependencies:
  - Quality goals
skills: []
workflows: []
adapters: []
