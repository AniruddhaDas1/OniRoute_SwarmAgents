  - Approved architecture decisions
  - API contracts and domain specifications
  - Operational guidance
  - Audience and documentation standards
outputs:
  - Technical documents and API references
  - Developer guides
  - Architecture documents
  - Documentation review findings
permissions:
  - Review approved engineering artifacts.
  - Produce and assess technical documentation.
  - Request clarification from technical owners.
dependencies:
  - Engineering discipline decisions
  - Knowledge organization guidance
  - Governance documentation standards
