[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oniroute-swarmagents"
version = "0.6.1"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "pydantic>=2.7", "PyYAML>=6.0", "rich>=13.7", "networkx>=3.3"]

[project.scripts]
oniroute = "cli.main:app"

[tool.setuptools]
packages = ["runtime", "runtime.context", "runtime.execution", "runtime.models", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
