[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oniroute-swarmagents"
version = "1.0.0"
description = "Local-first, provider-independent swarm agent architecture and runtime"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "pydantic>=2.7", "PyYAML>=6.0", "rich>=13.7", "networkx>=3.3"]

[project.optional-dependencies]
dev = ["pytest>=9", "build>=1.2"]

[project.scripts]
oniroute = "cli.main:app"

[tool.setuptools]
packages = ["runtime", "runtime.context", "runtime.execution", "runtime.models", "runtime.tools", "runtime.invocation", "runtime.governance", "runtime.optimization", "runtime.workspace", "cli"]

[tool.setuptools.data-files]
"." = ["AUTHORS", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
