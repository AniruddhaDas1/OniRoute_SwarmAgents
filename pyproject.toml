[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oniroute-swarmagents"
version = "1.2.0"
description = "Organization Level Swarm Coding AI Agents — Local-first, provider-independent swarm agent architecture and runtime"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "pydantic>=2.7", "PyYAML>=6.0", "rich>=13.7", "networkx>=3.3"]
keywords = ["ai", "agents", "swarm", "coding", "llm", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
dev = ["pytest>=9", "build>=1.2"]
standalone = ["pyinstaller>=6.0"]

[project.scripts]
oniroute = "cli.main:main"

[project.urls]
Homepage = "https://github.com/AniruddhaDas1/OniRoute_SwarmAgents"
Repository = "https://github.com/AniruddhaDas1/OniRoute_SwarmAgents"
Issues = "https://github.com/AniruddhaDas1/OniRoute_SwarmAgents/issues"
Documentation = "https://github.com/AniruddhaDas1/OniRoute_SwarmAgents/tree/main/docs"

[tool.setuptools]
packages = [
    "runtime", "runtime.context", "runtime.execution", "runtime.intent",
    "runtime.models", "runtime.tools", "runtime.invocation", "runtime.governance",
    "runtime.optimization", "runtime.workspace", "runtime.mission",
    "runtime.agent", "runtime.organization", "runtime.skills",
    "runtime.swarm", "runtime.scaffold", "runtime.blueprint",
    "runtime.allocation", "runtime.contracts", "runtime.assembly",
    "runtime.engineering", "runtime.review", "runtime.healing",
    "runtime.validation", "runtime.router", "runtime.experience",
    "runtime.control", "runtime.distribution", "runtime.deployment",
    "cli",
]

[tool.setuptools.data-files]
"." = ["AUTHORS", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
